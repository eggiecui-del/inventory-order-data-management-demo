services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_order_demo
    ports:
      # host:container - 5433 on the host to avoid clashing with any other
      # local Postgres already using 5432. The app talks to "db" over the
      # compose network on 5432 either way; this mapping is only for
      # reaching the DB from tools on the host machine.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_APP_DB: inventory_order_demo
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  db_data:
